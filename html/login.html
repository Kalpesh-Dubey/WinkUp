<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinkUp</title>
    <link href="../css/login.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="main">
        <section class="branding">
            <div class="branding-visual">
                <img class="branding-image" src="../images/bimg.webp" alt="Friends connecting and sharing moments">
                <div class="branding-content">
                    <a href="../index.html">
                        <img src="../images/winkuplogo.webp" class="logo" alt="WinkUp-logo">
                    </a>
                    <h1><span>Post </span>it. Feel it. Live it.</h1>
                    <p>Make new friends and share your moments.</p>

                </div>
            </div>
        </section>
        <section class="authentication">
            <h1>Welcome Back&#128075;</h1>
            <p class="p">Login to continue to WinkUp</p>
            <form class="login-form">
                <label for="email">Email:</label>
                <div class="input-wrapper-e">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-mail preview-icon">
                        <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
                        <rect x="2" y="4" width="20" height="16" rx="2" />
                    </svg>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>
                <label for="password">Password:</label>
                <div class="input-wrapper-p">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-lock-keyhole preview-icon">
                        <circle cx="12" cy="16" r="1" />
                        <rect x="3" y="10" width="18" height="12" rx="2" />
                        <path d="M7 10V7a5 5 0 0 1 10 0v3" />
                    </svg>
                    <input type="password" id="password" placeholder="Enter password">
                    <svg xmlns="http://www.w3.org/2000/svg" class="eye" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="lucide lucide-eye preview-icon">
                        <path
                            d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                    <!-- <svg xmlns="http://www.w3.org/2000/svg" class="eye-off" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off preview-icon"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg> -->
                </div>
                <a href="#">Forgot Password?</a>
                <button type="submit"> Log In </button>
            </form>
            <!-- <div class="divider">

                <span></span>
                <p>OR</p> 
                <span></span>
            </div> -->
            <p class="para">Don't have an account? <a href="../html/signup.html">Sign Up</a></p>
        </section>
    </main>
</body>

</html>
